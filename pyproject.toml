[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-agentic-rag"
version = "0.45.0"
description = "Vietnamese legal RAG with immutable artifacts, API, and local UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1,<2",
    "fastapi>=0.139,<1",
    "numpy>=1.26,<3",
    "pydantic>=2,<3",
    "sentence-transformers==5.4.1",
    "transformers>=4.51,<6",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "pytest>=8",
]
official-scoring = [
    "nltk==3.7",
]

[project.scripts]
legal-rag-build-competition = "legal_agentic_rag.serving.cli:competition_build_main"
legal-rag-batch = "legal_agentic_rag.serving.cli:competition_batch_main"
legal-rag-submit = "legal_agentic_rag.competition.uit_dsc_2026.cli:submission_main"
legal-rag-score-warmup = "legal_agentic_rag.competition.uit_dsc_2026.cli:warmup_score_main"
legal-rag-prepare-dev = "legal_agentic_rag.competition.uit_dsc_2026.cli:development_split_main"
legal-rag-diagnose-retrieval = "legal_agentic_rag.serving.cli:retrieval_diagnostics_main"
legal-rag-compare = "legal_agentic_rag.serving.cli:compare_main"
legal-rag-evaluate = "legal_agentic_rag.serving.cli:evaluate_main"
legal-rag-prepare-serving = "legal_agentic_rag.serving.cli:prepare_serving_main"
legal-rag-serve = "legal_agentic_rag.serving.cli:serve_main"
legal-rag-validate = "legal_agentic_rag.serving.cli:validate_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
